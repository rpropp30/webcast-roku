<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Electrical Theory &amp; Energized-Line Safety for Powerline Workers</title>
<style>
/* ============================================================
   POWERLINE SAFETY TRAINING — self-contained presentation
   Fixed 1280x720 stage, scaled to fit. No scrolling.
   ============================================================ */
:root{
  --navy:#0B2545; --navy2:#134074; --navy-deep:#06162B; --steel:#3A5A80;
  --amber:#F5B100; --amber-d:#C88A00; --danger:#D4351A; --green:#2E8B57;
  --white:#fff; --ink:#1A2B3C; --gray:#5B6B7B; --light:#EEF2F7; --light2:#E2E9F1;
  --card-border:#CFD9E4;
  --stageW:1280px; --stageH:720px;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070c;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{
  position:relative;width:var(--stageW);height:var(--stageH);
  background:var(--white);overflow:hidden;transform-origin:center center;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}
.slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;visibility:hidden;transform:translateY(13px) scale(.994);
  transition:opacity .5s ease, transform .55s cubic-bezier(.22,.61,.36,1);
  background:linear-gradient(168deg,#ffffff 0%,#f2f6fb 100%);overflow:hidden}
.slide.active{opacity:1;visibility:visible;z-index:2;transform:none}
.slide.prev{z-index:1}

/* ---------- shared chrome ---------- */
.accent-bar{position:absolute;left:0;top:0;width:10px;height:100%;background:var(--amber)}
.kicker{position:absolute;left:46px;top:34px;font-size:14px;font-weight:800;letter-spacing:2.5px;
  color:var(--amber-d);text-transform:uppercase}
.headline{position:absolute;left:44px;top:56px;right:60px;font-size:34px;line-height:1.05;
  font-weight:800;color:var(--navy)}
.headline.with-kicker{top:62px}
.uline{position:absolute;left:46px;width:118px;height:5px;background:var(--amber);border-radius:3px}
.lead{position:absolute;left:46px;right:60px;font-size:16px;font-style:italic;color:var(--gray);line-height:1.3}
.footer{position:absolute;left:0;right:0;bottom:0;height:42px;border-top:2px solid var(--amber);
  display:flex;align-items:center;justify-content:space-between;padding:0 38px;
  font-size:11px;color:var(--gray);letter-spacing:.3px}
.footer .mod{font-weight:700;color:var(--navy2)}

/* ---------- bullets ---------- */
.body{position:absolute;left:46px;right:54px}
ul.blist{list-style:none}
ul.blist li{position:relative;padding-left:26px;line-height:1.28}
ul.blist li.l0{font-size:18px;color:var(--ink);margin-top:11px;font-weight:500}
ul.blist li.l0::before{content:"";position:absolute;left:4px;top:9px;width:9px;height:9px;background:var(--amber);border-radius:1px}
ul.blist li.l1{font-size:15px;color:#33485c;margin-top:5px;padding-left:42px}
ul.blist li.l1::before{content:"";position:absolute;left:24px;top:9px;width:11px;height:2px;background:var(--steel)}
ul.blist li.l2{font-size:13.5px;color:var(--gray);margin-top:3px;padding-left:58px}
ul.blist li.l2::before{content:"";position:absolute;left:42px;top:8px;width:4px;height:4px;background:var(--gray);border-radius:50%}
ul.blist li b,li.bold{font-weight:800;color:var(--navy)}

/* ---------- title slide ---------- */
.title-slide{background:radial-gradient(120% 120% at 80% 10%, #15376a 0%, var(--navy) 45%, var(--navy-deep) 100%)}
.title-slide .tower{position:absolute;right:0;top:0;height:100%;width:46%;opacity:.5}
.t-kicker{position:absolute;left:120px;top:236px;color:var(--amber);font-weight:800;letter-spacing:4px;font-size:16px}
.t-bar{position:absolute;left:86px;top:226px;width:18px;height:268px;background:var(--amber);border-radius:3px}
.t-title{position:absolute;left:120px;top:268px;right:520px;color:#fff;font-size:50px;font-weight:800;line-height:1.02}
.t-sub{position:absolute;left:124px;top:512px;right:430px;color:#C8D6E6;font-size:18px;line-height:1.3}
.t-pres{position:absolute;left:124px;top:600px;color:var(--steel);font-size:13px;letter-spacing:.5px}
.title-slide .topstripe,.divider .topstripe{position:absolute;left:0;top:0;width:100%;height:9px;background:var(--amber)}
.title-slide .botstripe{position:absolute;left:0;bottom:0;width:100%;height:6px;background:var(--amber)}

/* ---------- section divider ---------- */
.divider{background:linear-gradient(135deg,#14325c 0%,var(--navy) 48%,var(--navy-deep) 100%)}
.divider::before{content:"";position:absolute;inset:0;background:radial-gradient(56% 68% at 86% 16%,rgba(245,177,0,.18),transparent 62%);pointer-events:none}
.divider::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1.4px,transparent 1.5px);background-size:30px 30px;opacity:.6;pointer-events:none}
.divider .d-modlabel,.divider .d-num,.divider .d-rule,.divider .d-title,.divider .d-uline,.divider .d-items,.divider .topstripe{z-index:1}
.d-modlabel{position:absolute;left:90px;top:170px;color:var(--amber);font-weight:800;letter-spacing:3px;font-size:18px}
.d-num{position:absolute;left:78px;top:182px;color:#fff;font-weight:800;font-size:188px;line-height:.9;text-shadow:0 12px 40px rgba(0,0,0,.5)}
.d-rule{position:absolute;left:505px;top:170px;width:3px;height:380px;background:#2A476E}
.d-title{position:absolute;left:548px;top:178px;right:80px;color:#fff;font-size:38px;font-weight:800;line-height:1.04}
.d-uline{position:absolute;left:550px;top:312px;width:140px;height:5px;background:var(--amber);border-radius:3px}
.d-items{position:absolute;left:548px;top:344px;right:80px;list-style:none}
.d-items li{position:relative;padding-left:24px;color:#CFDCEC;font-size:17px;margin-top:13px}
.d-items li::before{content:"—";position:absolute;left:0;color:var(--amber);font-weight:700}

/* ---------- two-column cards ---------- */
.cols{position:absolute;left:46px;right:46px;display:flex;gap:26px}
.col{flex:1;background:var(--light);border:1px solid var(--card-border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.col .ch{padding:13px 22px;color:#fff;font-weight:800;font-size:17px}
.col .cb{padding:14px 22px 18px}
.col ul{list-style:none}
.col ul li{position:relative;padding-left:22px;font-size:14.5px;color:var(--ink);margin-top:9px;line-height:1.25}
.col ul li::before{content:"";position:absolute;left:2px;top:7px;width:8px;height:8px;background:var(--amber);border-radius:1px}
.col ul li.sub{padding-left:38px;font-size:13px;color:var(--gray);margin-top:4px}
.col ul li.sub::before{content:"";left:20px;top:8px;width:10px;height:2px;background:var(--steel);border-radius:0}

/* ---------- callout layout ---------- */
.co-body{position:absolute;left:46px;top:0;width:730px}
.co-box{position:absolute;width:420px;border-radius:14px;overflow:hidden;border:2px solid}
.co-box .coh{padding:12px 20px;color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.co-box .cob{padding:16px 22px 20px}
.co-box .cot{font-weight:800;font-size:16px;margin-bottom:8px}
.co-box .cob ul{list-style:none}
.co-box .cob li{position:relative;padding-left:18px;font-size:13.5px;color:var(--ink);line-height:1.32;margin-top:7px}
.co-box .cob li::before{content:"–";position:absolute;left:0;font-weight:700}
.k-danger{border-color:var(--danger);background:#FBEAE7} .k-danger .coh{background:var(--danger)} .k-danger .cot,.k-danger li::before{color:var(--danger)}
.k-warn{border-color:var(--amber-d);background:#FDF4DE} .k-warn .coh{background:var(--amber-d)} .k-warn .cot,.k-warn li::before{color:var(--amber-d)}
.k-safe{border-color:var(--green);background:#E6F3EC} .k-safe .coh{background:var(--green)} .k-safe .cot,.k-safe li::before{color:var(--green)}
.k-info{border-color:var(--navy2);background:#E7EEF6} .k-info .coh{background:var(--navy2)} .k-info .cot,.k-info li::before{color:var(--navy2)}

/* ---------- table ---------- */
.tbl{position:absolute;left:46px;right:46px;border-collapse:collapse;width:calc(100% - 92px);
  box-shadow:0 6px 20px rgba(11,37,69,.10);border-radius:8px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;text-align:left;padding:10px 14px;font-size:13.5px;font-weight:700}
.tbl td{padding:8px 14px;font-size:13px;color:var(--ink);border-bottom:1px solid #e6ecf3}
.tbl tr:nth-child(even) td{background:var(--light)}
.tbl td.c0{font-weight:700;color:var(--navy)}
.tnote{position:absolute;left:46px;right:46px;font-size:11.5px;color:var(--gray);font-style:italic;line-height:1.3}

/* ---------- process steps ---------- */
.steps{position:absolute;left:46px;right:54px}
.step{display:flex;align-items:center;gap:18px;margin-top:11px}
.step .num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--navy);
  font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.step .stx h4{color:var(--navy);font-size:16px;font-weight:800}
.step .stx p{color:var(--gray);font-size:13px;line-height:1.25;margin-top:1px}

/* ---------- stat cards ---------- */
.stats{position:absolute;left:46px;right:46px;display:flex;gap:20px}
.stat{flex:1;background:var(--navy);border-radius:12px;padding:22px 12px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;width:100%;height:7px;background:var(--amber)}
.stat .big{color:var(--amber);font-size:42px;font-weight:800;line-height:1}
.stat .lbl{color:#fff;font-size:13px;margin-top:10px;line-height:1.2}
.statnote{position:absolute;left:46px;right:46px;font-size:14px;color:var(--ink);line-height:1.35}

/* ---------- closing ---------- */
.closing{background:radial-gradient(120% 120% at 80% 10%, #15376a 0%, var(--navy) 45%, var(--navy-deep) 100%)}
.cl-bar{position:absolute;left:86px;top:250px;width:18px;height:190px;background:var(--amber);border-radius:3px}
.cl-title{position:absolute;left:124px;top:250px;right:120px;color:#fff;font-size:48px;font-weight:800}
.cl-sub{position:absolute;left:128px;top:340px;right:240px;color:#C8D6E6;font-size:18px;line-height:1.35}
.cl-tag{position:absolute;left:128px;top:452px;right:200px;color:var(--amber);font-size:17px;font-style:italic}

/* ---------- diagram slides ---------- */
.dgm-wide{position:absolute;left:46px;right:46px}
.dgm-wide svg{filter:drop-shadow(0 8px 22px rgba(11,37,69,.13))}
.dgm-cap{position:absolute;left:46px;right:46px;text-align:center;font-size:15px;color:var(--ink);line-height:1.3}
.dgm-cap b{color:var(--navy);font-weight:800}
.dgm-split{position:absolute;left:46px;width:648px}
.dgm-split svg{filter:drop-shadow(0 8px 22px rgba(11,37,69,.13))}
.dgm-notes{position:absolute;left:726px;right:40px}
.dgm-notes .dgm-nh{font-size:13px;font-weight:800;letter-spacing:1.5px;color:var(--amber-d);text-transform:uppercase;margin-bottom:8px}
.dgm-notes ul{list-style:none}
.dgm-notes li{position:relative;padding-left:24px;font-size:15px;color:var(--ink);line-height:1.26;margin-top:12px}
.dgm-notes li::before{content:"";position:absolute;left:3px;top:7px;width:9px;height:9px;background:var(--amber);border-radius:1px}
.dgm-notes li b{color:var(--navy);font-weight:800}
.dgm-notes .tip{margin-top:18px;padding:11px 14px;background:var(--light);border-left:4px solid var(--navy2);border-radius:6px;font-size:13.5px;color:var(--ink);line-height:1.32}

/* ---------- diagram animations (ignored by static PNG/pptx render) ---------- */
@media (prefers-reduced-motion: no-preference){
  .dgm-flow{stroke-dasharray:7 11;animation:dgmflow .9s linear infinite}
  .dgm-current{animation:dgmflow .8s linear infinite}
  @keyframes dgmflow{to{stroke-dashoffset:-36}}
  .dgm-spin{transform-box:fill-box;transform-origin:center;animation:dgmspin 18s linear infinite}
  @keyframes dgmspin{to{transform:rotate(360deg)}}
  .dgm-drift{animation:dgmdrift 1.6s linear infinite}
  @keyframes dgmdrift{from{transform:translateX(0)}to{transform:translateX(46px)}}
  .dgm-spark{animation:dgmspark .5s ease-in-out infinite}
  @keyframes dgmspark{0%,100%{opacity:.5}50%{opacity:1}}
  .dgm-seq{animation:dgmseq 2.6s ease-in-out infinite}
  @keyframes dgmseq{0%,72%,100%{opacity:.82}12%,30%{opacity:1;filter:drop-shadow(0 0 5px rgba(245,177,0,.9))}}
  .dgm-travel{animation:dgmtravel 2.8s linear infinite}
  @keyframes dgmtravel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(920px);opacity:0}}
}

/* ---------- dark theme (toggle with D) ---------- */
body.dark{background:#02060c}
body.dark #stage{background:#0b1a2e}
body.dark .slide{background:#0c1a2e}
body.dark .headline{color:#eaf1f8}
body.dark .lead{color:#9fb1c4}
body.dark .footer{color:#8aa0b6}
body.dark .footer .mod{color:#9db6d6}
body.dark ul.blist li.l0{color:#e7eef6}
body.dark ul.blist li.l1{color:#b9c6d6}
body.dark ul.blist li.l2{color:#92a3b6}
body.dark ul.blist li b,body.dark li.bold{color:#ffd970}
body.dark .col{background:#13233b;border-color:#26384f}
body.dark .col ul li{color:#dfe8f2}
body.dark .col ul li.sub{color:#9fb1c4}
body.dark .tbl td{background:#13233b;color:#dfe8f2;border-bottom-color:#26384f}
body.dark .tbl tr:nth-child(even) td{background:#0f1d31}
body.dark .tbl td.c0{color:#ffd970}
body.dark .tnote{color:#93a5b8}
body.dark .step .stx h4{color:#eaf1f8}
body.dark .step .stx p{color:#9fb1c4}
body.dark .statnote{color:#dfe8f2}
body.dark .dgm-notes li{color:#dfe8f2}
body.dark .dgm-notes .tip{background:#13233b;color:#dfe8f2;border-left-color:#5B8FB9}
body.dark .dgm-cap{color:#dfe8f2}
body.dark .dgm-cap b{color:#ffd970}

/* ---------- art slot (for illustrations added later) ---------- */
.art{position:absolute}

/* ============================================================
   UI CONTROLS
   ============================================================ */
#progress{position:fixed;left:0;top:0;height:4px;background:linear-gradient(90deg,var(--amber-d),var(--amber),#ffd35a);z-index:50;width:0;transition:width .4s cubic-bezier(.22,.61,.36,1);box-shadow:0 0 10px rgba(245,177,0,.7)}
.nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:40;width:46px;height:46px;border-radius:50%;
  border:none;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;transition:background .2s}
.nav-btn:hover{background:rgba(245,177,0,.85);color:var(--navy)}
#prev{left:14px}#next{right:14px}
#hud{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:14px;align-items:center;
  background:rgba(6,16,30,.6);backdrop-filter:blur(6px);padding:7px 16px;border-radius:30px;color:#cdd9e6;font-size:12px;
  font-family:var(--font);opacity:.85}
#hud button{background:none;border:none;color:#cdd9e6;cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
#hud button:hover{color:var(--amber)}
#counter{font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
#title-tag{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8fa3ba}
/* speaker notes drawer */
#notes-panel{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(8,22,43,.97);backdrop-filter:blur(8px);
  color:#e7eef6;border-top:3px solid var(--amber);padding:14px 26px 18px;transform:translateY(112%);transition:transform .3s ease;max-height:36vh;overflow:auto}
#notes-panel.show{transform:none}
#notes-panel .nh{font-size:11px;font-weight:800;letter-spacing:1.8px;color:var(--amber);text-transform:uppercase;margin-bottom:6px}
#notes-panel .nb{font-size:15.5px;line-height:1.5;color:#dfe8f2;max-width:1040px}
#notes-panel .nt{position:absolute;top:12px;right:20px;color:#8fa3ba;font-size:12px}
/* overview grid */
#overview{position:fixed;inset:0;z-index:60;background:rgba(5,8,14,.97);display:none;overflow:auto;padding:30px}
#overview.show{display:block}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:1400px;margin:0 auto}
.ov-card{aspect-ratio:16/9;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;position:relative;background:#0c1726}
.ov-card:hover{border-color:var(--amber)}
.ov-thumb{position:absolute;inset:0;transform-origin:top left}
.ov-n{position:absolute;left:6px;bottom:5px;z-index:3;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:5px}
@media (max-width:600px){.nav-btn{width:38px;height:38px}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="stage"></div></div>

<button class="nav-btn" id="prev" aria-label="Previous">&#10094;</button>
<button class="nav-btn" id="next" aria-label="Next">&#10095;</button>

<div id="hud">
  <button id="ovbtn" title="Overview (O)">▦ Overview</button>
  <span id="title-tag"></span>
  <span id="counter">1 / 1</span>
  <button id="notesbtn" title="Speaker notes (N)">🗒 Notes</button>
  <button id="darkbtn" title="Dark theme (D)">🌓 Theme</button>
  <button id="fsbtn" title="Fullscreen (F)">⛶ Fullscreen</button>
</div>

<div id="notes-panel"><div class="nh">Speaker Notes</div><div class="nb" id="notes-body"></div><span class="nt">press N to hide</span></div>

<div id="overview"><div class="ov-grid" id="ovgrid"></div></div>

<script src="notes.js"></script>
<script src="diagrams.js"></script>
<script>
/* ============================================================
   DECORATIVE SVG (tower motif) for title/closing
   ============================================================ */
const TOWER_SVG = `<svg class="tower" viewBox="0 0 600 720" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1b3c66" stroke-width="3" fill="none" opacity="0.9">
    <line x1="420" y1="0" x2="420" y2="720"/><line x1="500" y1="0" x2="500" y2="720"/><line x1="580" y1="0" x2="580" y2="720"/>
    <line x1="360" y1="150" x2="600" y2="150"/><line x1="360" y1="250" x2="600" y2="250"/><line x1="360" y1="350" x2="600" y2="350"/>
  </g>
  <g fill="#244a7a"><circle cx="420" cy="150" r="6"/><circle cx="500" cy="150" r="6"/><circle cx="580" cy="150" r="6"/>
   <circle cx="420" cy="250" r="6"/><circle cx="500" cy="250" r="6"/><circle cx="580" cy="250" r="6"/></g>
  <g stroke="#163357" stroke-width="2" fill="none" opacity="0.6">
    <path d="M360 158 C 420 230, 500 230, 600 162"/><path d="M360 258 C 420 330, 500 330, 600 262"/>
  </g>
</svg>`;

/* ============================================================
   RENDER HELPERS  (each returns HTML for the inner stage)
   ============================================================ */
const esc = s => s; // content is trusted/static
function footer(mod, n){return `<div class="footer"><span class="mod">${mod}</span><span>Powerline Electrical Theory &amp; Safety &nbsp;|&nbsp; ${String(n).padStart(2,'0')}</span></div>`;}
function header(title,kicker,leadY){
  let h=`<div class="accent-bar"></div>`;
  let topT=56, topU, leadHTML='';
  if(kicker){h+=`<div class="kicker">${kicker}</div>`; topT=62;}
  h+=`<div class="headline${kicker?' with-kicker':''}" style="top:${topT}px">${title}</div>`;
  topU = topT + 56;
  h+=`<div class="uline" style="top:${topU}px"></div>`;
  return {h, bodyTop: topU+22};
}
function bulletItems(items){
  return '<ul class="blist">'+items.map(b=>{
    const lvl=b.lvl||0; const txt=b.bold?`<b>${b.t}</b>`:b.t;
    return `<li class="l${lvl}">${txt}</li>`;
  }).join('')+'</ul>';
}

const RENDER = {
  title(s,i){
    return `<div class="slide title-slide"><div class="topstripe"></div>${TOWER_SVG}
      <div class="t-bar"></div>
      <div class="t-kicker">${s.kicker}</div>
      <div class="t-title">${s.title}</div>
      <div class="t-sub">${s.sub}</div>
      ${s.pres?`<div class="t-pres">${s.pres}</div>`:''}
      <div class="botstripe"></div></div>`;
  },
  divider(s,i){
    return `<div class="slide divider"><div class="topstripe"></div>
      <div class="d-modlabel">MODULE</div>
      <div class="d-num">${s.num}</div>
      <div class="d-rule"></div>
      <div class="d-title">${s.title}</div><div class="d-uline"></div>
      <ul class="d-items">${s.items.map(it=>`<li>${it}</li>`).join('')}</ul></div>`;
  },
  bullets(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);

    if(s.lead){leadHTML=`<div class="lead" style="top:${bodyTop}px">${s.lead}</div>`; top=bodyTop+44;}
    return `<div class="slide">${h}${leadHTML}
      <div class="body" style="top:${top}px">${bulletItems(s.items)}</div>
      ${footer(s.mod,i)}</div>`;
  },
  twocol(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    const lc=s.lc||'var(--navy2)', rc=s.rc||'var(--steel)';
    const colHTML=(head,items,color)=>`<div class="col"><div class="ch" style="background:${color}">${head}</div>
      <div class="cb"><ul>${items.map(it=>{const sub=(typeof it==='object'&&it.sub);return `<li class="${sub?'sub':''}">${sub?it.t:it}</li>`;}).join('')}</ul></div></div>`;
    return `<div class="slide">${h}
      <div class="cols" style="top:${bodyTop}px">${colHTML(s.lh,s.li,lc)}${colHTML(s.rh,s.ri,rc)}</div>
      ${footer(s.mod,i)}</div>`;
  },
  callout(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    const labels={danger:'⚠ DANGER',warn:'⚠ WARNING',safe:'✓ BEST PRACTICE',info:'◆ KEY CONCEPT'};
    const body=`<div class="co-body" style="top:${bodyTop+4}px">${bulletItems(s.items)}</div>`;
    const cot=Array.isArray(s.coText)?`<ul>${s.coText.map(t=>`<li>${t}</li>`).join('')}</ul>`:`<p style="font-size:13.5px;line-height:1.4;color:var(--ink)">${s.coText}</p>`;
    const box=`<div class="co-box k-${s.kind}" style="left:818px;top:${bodyTop+8}px">
      <div class="coh">${labels[s.kind]}</div>
      <div class="cob"><div class="cot">${s.coTitle}</div>${cot}</div></div>`;
    return `<div class="slide">${h}${body}${box}${footer(s.mod,i)}</div>`;
  },
  table(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    const cols=s.cw;
    const colg=cols?`<colgroup>${cols.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>`:'';
    const thead=`<tr>${s.headers.map(x=>`<th>${x}</th>`).join('')}</tr>`;
    const tb=s.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${ci===0?'c0':''}">${c}</td>`).join('')}</tr>`).join('');
    const note=s.note?`<div class="tnote" style="top:${bodyTop+8+ (s.rows.length+1)*33 + 14}px">${s.note}</div>`:'';
    return `<div class="slide">${h}
      <table class="tbl" style="top:${bodyTop+8}px;font-size:${s.fs||13}px">${colg}<thead>${thead}</thead><tbody>${tb}</tbody></table>
      ${note}${footer(s.mod,i)}</div>`;
  },
  process(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    let top=bodyTop, leadHTML='';
    if(s.lead){leadHTML=`<div class="lead" style="top:${bodyTop}px">${s.lead}</div>`; top=bodyTop+40;}
    const steps=s.steps.map((st,idx)=>`<div class="step"><div class="num">${idx+1}</div>
      <div class="stx"><h4>${st.h}</h4><p>${st.p}</p></div></div>`).join('');
    return `<div class="slide">${h}${leadHTML}<div class="steps" style="top:${top}px">${steps}</div>${footer(s.mod,i)}</div>`;
  },
  stats(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    let top=bodyTop, leadHTML='';
    if(s.lead){leadHTML=`<div class="lead" style="top:${bodyTop}px">${s.lead}</div>`; top=bodyTop+44;}
    const cards=s.stats.map(st=>`<div class="stat"><div class="big">${st.big}</div><div class="lbl">${st.lbl}</div></div>`).join('');
    const note=s.note?`<div class="statnote" style="top:${top+200}px">${s.note}</div>`:'';
    return `<div class="slide">${h}${leadHTML}<div class="stats" style="top:${top}px">${cards}</div>${note}${footer(s.mod,i)}</div>`;
  },
  diagram(s,i){
    const {h,bodyTop}=header(s.title,s.kicker);
    const fig=(window.DIAGRAMS&&window.DIAGRAMS[s.fig])?window.DIAGRAMS[s.fig]():'';
    let inner='';
    if((s.layout||'split')==='wide'){
      const top=bodyTop+6;
      inner=`<div class="dgm-wide" style="top:${top}px">${fig}</div>`;
      if(s.caption) inner+=`<div class="dgm-cap" style="top:${top+(s.capY||452)}px">${s.caption}</div>`;
    }else{
      const top=bodyTop+10;
      inner=`<div class="dgm-split" style="top:${top}px">${fig}</div>`;
      let notes='';
      if(s.notes) notes=`<div class="dgm-nh">What you're seeing</div><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`;
      if(s.tip) notes+=`<div class="tip">${s.tip}</div>`;
      inner+=`<div class="dgm-notes" style="top:${top+6}px">${notes}</div>`;
    }
    return `<div class="slide">${h}${inner}${footer(s.mod,i)}</div>`;
  },
  closing(s,i){
    return `<div class="slide closing"><div class="topstripe"></div>
      <div class="cl-bar"></div>
      <div class="cl-title">${s.title}</div>
      <div class="cl-sub">${s.sub}</div>
      <div class="cl-tag">${s.tag}</div>
      <div class="botstripe"></div></div>`;
  }
};

   {lvl:0,t:'An arc flash is an explosive release of energy when current jumps through ionized air'},
   {lvl:1,t:'Triggered by faults, dropped tools, animals, equipment failure, or getting too close'},
   {lvl:0,t:'Arc FLASH = light &amp; heat: temperatures up to ~35,000°F (hotter than the sun\'s surface)'},
   {lvl:0,t:'Arc BLAST = pressure wave: vaporized metal expands violently'},
   {lvl:1,t:'Copper expands ~67,000 times when it vaporizes — like a small explosion'},
   {lvl:1,t:'Concussive force, shrapnel, molten metal spray, sound &gt; 140 dB'},
   {lvl:0,t:'Incident energy is measured in cal/cm² — it sets the arc rating of PPE you must wear'},
  ],
  coTitle:'Controlled by',
  coText:['Distance (clearances), de-energizing, and arc-rated FR clothing/face protection.',
          'An arc flash can occur WITHOUT you touching anything — proximity alone can trigger it.']},

{type:'callout',mod:M2,kicker:'2.6 Ground Gradients',title:'Step Potential &amp; Touch Potential',kind:'danger',
  items:[
   {lvl:0,t:'When current flows into the earth (a downed line, a fault to a ground rod), it spreads out'},
   {lvl:0,t:'Voltage drops with distance from the contact point — forming a “voltage gradient” across the ground'},
   {lvl:0,t:'STEP POTENTIAL: the voltage difference between your two feet'},
   {lvl:1,t:'One foot sits at a higher potential than the other — current flows up one leg, down the other'},
   {lvl:1,t:'The wider your stride, the greater the difference — and the greater the shock'},
   {lvl:0,t:'TOUCH POTENTIAL: difference between your hand (on an object) and your feet'},
   {lvl:1,t:'Touching a faulted structure while standing on ground at a different potential'},
  ],
  coTitle:'If you must leave an energized area',
  coText:['Keep feet together and SHUFFLE or bunny-hop — never take a normal stride.',
          'Assume the ground around any downed line is energized out to a wide radius.',
          'Equipotential bonding &amp; grounding eliminate these gradients in your work zone.']},

{type:'bullets',mod:M2,kicker:'2.7 Downed Lines',title:'Downed Conductors &amp; The Ground Around You',
  lead:'The most dangerous ground is the ground that looks perfectly normal.',
  items:[
   {lvl:0,t:'A downed line may look dead — it is NOT until tested and grounded'},
   {lvl:1,t:'It may be re-energized automatically by reclosers, or back-fed by a customer\'s generator'},
   {lvl:0,t:'Energized ground can extend many feet from the contact point — you cannot see it'},
   {lvl:0,t:'Vehicles in contact with lines: occupants should STAY INSIDE unless fire forces evacuation'},
   {lvl:1,t:'If they must exit: JUMP clear without touching vehicle and ground at once, then shuffle away'},
   {lvl:0,t:'Keep the public back — establish a wide barrier and treat everything as energized'},
   {lvl:0,t:'Never approach within the established radius until the line is confirmed de-energized &amp; grounded'},
  ]},

{type:'bullets',mod:M2,kicker:'Module 2 Recap',title:'Module 2 — Key Takeaways',
  items:[
   {lvl:0,t:'Current — not voltage — injures; the dangerous range begins in milliamps'},
   {lvl:0,t:'Path across the heart and 60 Hz AC make fibrillation likely; wet skin worsens everything'},
   {lvl:0,t:'Above the let-go threshold you cannot release — so we never rely on letting go'},
   {lvl:0,t:'Arc flash/blast can kill or maim WITHOUT contact — distance and FR PPE are your defense'},
   {lvl:0,t:'Energized ground creates step &amp; touch potential — shuffle out, bond and ground your zone'},
   {lvl:0,t:'After any contact: get medical evaluation — internal damage hides'},
  ]},

/* ===== MODULE 3 ===== */
{type:'divider',num:'3',title:'Working Around Energized Lines &amp; Equipment',
  items:['Minimum approach distance','The second point of contact — the core concept',
         'Isolate, insulate &amp; cover-up','Grounding &amp; the equipotential zone','De-energizing, LOTO &amp; induced voltage']},

{type:'bullets',mod:M3,kicker:'3.1 Controls',title:'The Hierarchy of Controls for Electrical Work',
  lead:'Reach for the top of the hierarchy first; PPE alone is never the plan.',
  items:[
   {lvl:0,t:'The safest energized work is work that isn\'t energized — always prefer de-energizing where feasible'},
   {lvl:0,t:'Order of preference when planning a job:'},
   {lvl:1,t:'1. Eliminate — de-energize, isolate, lock &amp; tag, test dead, and ground'},
   {lvl:1,t:'2. Substitute / engineer — reroute, switch load, use remote/robotic methods'},
   {lvl:1,t:'3. Isolate the worker — insulate &amp; isolate (rubber-glove or hot-stick / live-line bare-hand)'},
   {lvl:1,t:'4. Administrative — procedures, job briefings, MAD, qualified workers only'},
   {lvl:1,t:'5. PPE — FR clothing, rubber gloves/sleeves, face &amp; head protection (last line, never the only line)'},
   {lvl:0,t:'Energized work is permitted only when de-energizing is infeasible or creates greater hazard'},
  ]},

{type:'callout',mod:M3,kicker:'3.2 MAD',title:'Minimum Approach Distance (MAD)',kind:'warn',
  items:[
   {lvl:0,t:'MAD = the closest a qualified worker (or conductive object) may come to an energized part'},
   {lvl:0,t:'It protects against flashover — the air gap that voltage cannot jump'},
   {lvl:0,t:'MAD increases with voltage and with altitude (thinner air insulates less)'},
   {lvl:0,t:'It includes the phase-to-ground AND phase-to-phase exposure'},
   {lvl:0,t:'Anything conductive counts: your body, tools, materials, the boom, a tape measure'},
   {lvl:1,t:'Unqualified employees must stay even farther back'},
   {lvl:0,t:'If you cannot maintain MAD, the part must be de-energized OR covered/insulated'},
  ],
  coTitle:'Rule of thumb',
  coText:['Know your utility\'s MAD table for the voltage you\'re on — BEFORE you leave the ground.',
          'When in doubt, cover up or back off. MAD is a minimum, not a target.']},

{type:'table',mod:M3,kicker:'3.2 MAD Table',title:'Illustrative Minimum Approach Distances (Phase-to-Ground)',
  headers:['Nominal Voltage (ph-ph)','Example MAD','Typical Setting'], cw:[34,24,42], fs:12,
  rows:[['50 V – 300 V','Avoid contact','Service / secondary'],
        ['301 V – 750 V','~1 ft 1 in','Secondary / street light'],
        ['751 V – 15 kV','~2 ft 2 in','Distribution primary'],
        ['15.1 kV – 36 kV','~2 ft 7 in','Distribution / sub-transmission'],
        ['36.1 kV – 46 kV','~2 ft 9 in','Sub-transmission'],
        ['46.1 kV – 72.5 kV','~3 ft 3 in','Sub-transmission'],
        ['72.6 kV – 121 kV','~3 ft 4 in','Transmission'],
        ['138 kV – 145 kV','~3 ft 7 in','Transmission'],
        ['230 kV','~5 ft 3 in','Bulk transmission']],
  note:'ILLUSTRATIVE ONLY — distances vary with altitude, transient over-voltage factor, and the governing edition of OSHA 1910.269 Table R-3 / R-6. ALWAYS use your employer\'s current, approved MAD table.'},

{type:'callout',mod:M3,kicker:'3.3 SECOND POINT OF CONTACT',title:'The Second Point of Contact — The Concept That Saves Lives',kind:'danger',
  items:[
   {lvl:0,t:'Current can only flow when it has a complete path: a source, a load/body, and a return'},
   {lvl:0,t:'Touching ONE energized conductor while perfectly insulated from everything else = no path'},
   {lvl:1,t:'This is why a bird sits on a wire unharmed — one potential, no second contact'},
   {lvl:0,t:'The SECOND POINT OF CONTACT is what completes the circuit through you:'},
   {lvl:1,t:'A grounded neutral, a guy wire, a pole ground, a crossarm, the structure'},
   {lvl:1,t:'Another phase at a different potential (phase-to-phase — even more dangerous)'},
   {lvl:1,t:'A co-worker, a tool, the bucket, a wet rope, the truck'},
   {lvl:0,t:'Eliminate the second point of contact and you eliminate the shock — every time'},
  ],
  coTitle:'The discipline',
  coText:['Before you reach for ANY energized part, ask: “Where is my second point of contact?”',
          'Cover it. Insulate it. Or remove yourself from it.',
          'Most electrocutions are NOT phase-to-phase — they are phase-to-GROUND through a missed second point.']},

{type:'bullets',mod:M3,kicker:'3.3 Application',title:'Finding Your Second Point of Contact — Every Time',
  lead:'Rubber gloves alone are not the answer — you must also control what else you could touch.',
  items:[
   {lvl:0,t:'Scan the whole work envelope, not just the conductor you\'re working'},
   {lvl:0,t:'Common second points hiding in plain sight:'},
   {lvl:1,t:'Grounded neutral conductor (often the closest deadly path)'},
   {lvl:1,t:'The pole ground / ground wire, guy wires and down-guys'},
   {lvl:1,t:'Metal crossarm braces, bolts, staples, hardware'},
   {lvl:1,t:'Other phases above, below, or behind you'},
   {lvl:1,t:'Transformer cases, capacitor banks, riser/cable terminations'},
   {lvl:1,t:'The bucket lip, jib, winch line, hand line, or another worker'},
   {lvl:0,t:'Work to keep yourself, your tools, and the energized part isolated from all of them'},
   {lvl:0,t:'Glove AND cover: rubber gloves protect your hands; cover-up protects against the SECOND point'},
  ]},

{type:'bullets',mod:M3,kicker:'3.4 Two Methods',title:'Insulate &amp; Isolate — The Two Methods of Protection',
  items:[
   {lvl:0,t:'INSULATE: place insulating barriers between the worker and energized/grounded parts'},
   {lvl:1,t:'Rubber gloves, sleeves, line hose, hoods, blankets — rated for the voltage'},
   {lvl:1,t:'Insulated tools and platforms; the dielectric boom of an aerial device'},
   {lvl:0,t:'ISOLATE: create distance/separation so no path can form'},
   {lvl:1,t:'Maintain MAD; reposition the work; use live-line (hot-stick) tools to keep the worker back'},
   {lvl:0,t:'Rubber-glove method: worker is insulated and works within reach — cover-up is mandatory'},
   {lvl:0,t:'Hot-stick / live-line tool method: worker stays beyond MAD and works through tools'},
   {lvl:0,t:'Bare-hand (live-line) method: worker is bonded TO the conductor at line potential — specialized, EHV'},
  ]},

{type:'bullets',mod:M3,kicker:'3.5 Cover-Up',title:'Cover-Up: Purpose &amp; Principles',
  lead:'Cover-up turns a cluttered, energized pole top into an isolated, defendable work zone.',
  items:[
   {lvl:0,t:'Cover-up = installing insulating guards over energized AND grounded parts in the work zone'},
   {lvl:0,t:'Purpose: protect against accidental contact and eliminate second points of contact'},
   {lvl:1,t:'It is secondary protection — it backs up your gloves, MAD, and positioning'},
   {lvl:0,t:'Cover EVERYTHING within reach you could contact: phases, neutral, ground, hardware, guys'},
   {lvl:0,t:'Cover-up must be rated for the system voltage and inspected before use'},
   {lvl:0,t:'Install from a position of safety — nearest/most-accessible energized part first, working outward'},
   {lvl:1,t:'Use a hot stick or gloved hands per procedure; never let cover-up create false security'},
   {lvl:0,t:'Remove in REVERSE order — last on, first off — keeping protection in place longest where you work'},
  ]},

{type:'process',mod:M3,kicker:'3.5 Sequence',title:'Cover-Up Sequence — Building the Protected Zone',
  steps:[
   {h:'1. Plan &amp; inspect',p:'Identify every energized &amp; grounded part within reach. Inspect all cover-up for damage; verify voltage rating.'},
   {h:'2. Establish footing',p:'Position the bucket/yourself so you can reach with the conductor at a safe angle — from below where possible.'},
   {h:'3. Cover the closest hazard first',p:'Apply line hose/blankets to the nearest energized phase, then work outward to additional phases.'},
   {h:'4. Cover the second points',p:'Cover the neutral, ground wire, guys, crossarm hardware — anything that could be your second point of contact.'},
   {h:'5. Work the job',p:'With the zone insulated, perform the task maintaining gloves, MAD, and positioning throughout.'},
   {h:'6. Remove in reverse',p:'Strip cover-up last-on/first-off — keep protection nearest you in place until the end.'},
  ]},

{type:'twocol',mod:M3,kicker:'3.5 Equipment',title:'Cover-Up Equipment',
  lh:'Types of cover-up', lc:'var(--navy2)',
  li:['Line hose — tubular cover for conductors','Insulator hoods — cover pin/post insulators &amp; tops',
      'Conductor/line covers &amp; connector covers','Insulating blankets — wrap irregular shapes, hardware',
      'Dead-end &amp; pole/crossarm covers, guy guards'],
  rh:'Selection &amp; care', rc:'var(--green)',
  ri:['Match the voltage rating to (or above) the system','Inspect for cuts, ozone cracks, embedded metal, swelling',
      'Keep clean &amp; dry; store properly — no sharp folds','Use approved clip pins/connectors so it stays put',
      'Removed from service &amp; retested per schedule if suspect']},

{type:'callout',mod:M3,kicker:'3.6 De-Energize / LOTO',title:'De-Energizing &amp; Lockout/Tagout (LOTO)',kind:'warn',
  items:[
   {lvl:0,t:'When a line can be de-energized, follow the formal switching &amp; clearance procedure'},
   {lvl:0,t:'The classic verification sequence — do not skip a step:'},
   {lvl:1,t:'1. Identify the correct circuit/section (right line, right structure)'},
   {lvl:1,t:'2. Open the disconnects and render them visibly open'},
   {lvl:1,t:'3. Lock and TAG the points of isolation — each worker\'s own lock'},
   {lvl:1,t:'4. TEST for absence of voltage with a tested-good detector (test-before-touch)'},
   {lvl:1,t:'5. Apply protective GROUNDS to create an equipotential, drained zone'},
   {lvl:0,t:'Hold the clearance; only the holder releases it after all workers are clear'},
  ],
  coTitle:'Test your tester',
  coText:['Prove the voltage detector works on a known source BEFORE and AFTER testing the line.',
          'Treat every conductor as energized until YOU have verified it dead and grounded.']},

{type:'callout',mod:M3,kicker:'3.7 Grounding &amp; EPZ',title:'Grounding &amp; The Equipotential Zone',kind:'info',
  items:[
   {lvl:0,t:'Protective grounding does NOT just “drain” the line — it protects YOU if it is re-energized'},
   {lvl:0,t:'If the line is accidentally energized, grounds provide a low-resistance path that trips protection fast'},
   {lvl:0,t:'Equipotential zone (EPZ): bond everything you could touch to the SAME potential'},
   {lvl:1,t:'If everything around you is at the same voltage, no current flows through you — like the bird'},
   {lvl:0,t:'Bonding: connect conductors, structures, and equipment together; ground that bonded system'},
   {lvl:0,t:'Grounds must be sized for available fault current and connected in the correct order'},
   {lvl:1,t:'Connect to ground/structure FIRST, then to the conductor; remove in REVERSE'},
  ],
  coTitle:'Why grounds save lives',
  coText:['A worker inside a properly bonded EPZ rides the voltage up and down together — no difference of potential across the body.',
          'Grounds are sized to carry fault current long enough for the breaker/recloser to operate.']},

{type:'bullets',mod:M3,kicker:'3.8 Induced Voltage',title:'Induced Voltage — The Hidden Hazard on “Dead” Lines',
  lead:'“Dead” is not the same as “grounded.” Induction is why we ground at the work location.',
  items:[
   {lvl:0,t:'A de-energized line running parallel to an energized one can pick up voltage by induction'},
   {lvl:1,t:'Magnetic (current) and electrostatic (voltage) coupling from the live circuit'},
   {lvl:0,t:'The longer the parallel and the higher the live circuit\'s load, the greater the induced voltage'},
   {lvl:0,t:'An ungrounded “dead” line can hold enough induced potential to shock or kill'},
   {lvl:0,t:'Control it by GROUNDING — and by working within a bonded equipotential zone'},
   {lvl:1,t:'Grounds at the work site (not just at the ends) keep induced potential off the worker'},
   {lvl:0,t:'Switching, transmission, and parallel-circuit work demand extra attention to induction'},
  ]},

{type:'bullets',mod:M3,kicker:'Module 3 Recap',title:'Module 3 — Key Takeaways',
  items:[
   {lvl:0,t:'Prefer de-energizing; when working hot, isolate AND insulate — never rely on one control'},
   {lvl:0,t:'Maintain MAD for your voltage; anything conductive counts toward the distance'},
   {lvl:0,t:'THE SECOND POINT OF CONTACT completes the circuit — find it, cover it, remove it, every time'},
   {lvl:0,t:'Cover-up backs up your gloves and MAD: nearest first, remove in reverse'},
   {lvl:0,t:'De-energize properly: identify, open, lock/tag, TEST, then GROUND'},
   {lvl:0,t:'Bond an equipotential zone and ground at the work site — it defeats re-energization AND induction'},
  ]},

/* ===== MODULE 4 ===== */
{type:'divider',num:'4',title:'Tools of the Trade',
  items:['Rubber insulating gloves &amp; sleeves','Live-line (hot-stick) tools','Protective grounds &amp; testers',
         'Arc-rated FR clothing &amp; PPE','Inspection, testing &amp; care']},

{type:'bullets',mod:M4,kicker:'4.1 Rubber Gloves',title:'Rubber Insulating Gloves — Your First Line of Defense',
  items:[
   {lvl:0,t:'Rubber gloves insulate your hands from energized parts in the rubber-glove method'},
   {lvl:0,t:'Always worn with leather protector gloves OVER them'},
   {lvl:1,t:'The leather shields the rubber from cuts, abrasion, and UV — the rubber does the insulating'},
   {lvl:0,t:'Selected by VOLTAGE CLASS — each class has a max use voltage and proof-test voltage'},
   {lvl:0,t:'Field-inspect before EVERY use:'},
   {lvl:1,t:'Air-test (roll/inflate) to find pinholes; check for cuts, cracks, swelling, embedded debris'},
   {lvl:1,t:'Inspect inside and out; check for chemical or ozone damage'},
   {lvl:0,t:'Retest electrically on a schedule (typically every 6 months) at a certified lab'},
   {lvl:0,t:'Store in a glove bag, fingers up, away from heat, ozone, sunlight, and sharp objects'},
  ]},

{type:'table',mod:M4,kicker:'4.1 Glove Classes',title:'Rubber Glove Voltage Classes (ASTM D120 / IEC)',
  headers:['Class','Max Use Voltage (AC, ph-ph)','Label Color','Proof Test'], cw:[16,34,24,26], fs:13.5,

        ['Class 1','7,500 V','White','10,000 V'],['Class 2','17,000 V','Yellow','20,000 V'],
        ['Class 3','26,500 V','Green','30,000 V'],['Class 4','36,000 V','Orange','40,000 V']],
  note:'Always select a class rated AT or ABOVE the maximum voltage you may contact. Label color aids quick identification; the printed rating governs. The same class system applies to insulating sleeves and many blankets.'},

{type:'twocol',mod:M4,kicker:'4.2 Sleeves &amp; Cover',title:'Rubber Sleeves, Blankets &amp; Line Hose',
  lh:'Sleeves', lc:'var(--navy2)',
  li:['Insulate the forearm, upper arm, and shoulder','Worn when the arm could contact an energized/grounded part',
      'Same voltage-class system as gloves','Inspected &amp; retested like gloves'],
  rh:'Blankets &amp; line hose', rc:'var(--steel)',
  ri:['Blankets: flexible cover for irregular shapes &amp; hardware','Line hose: slips over conductors to insulate runs',
      'Secured with approved pins/snaps/clamps','Voltage-rated; inspected for cuts, ozone &amp; contamination']},

{type:'bullets',mod:M4,kicker:'4.3 Hot Sticks',title:'Live-Line (Hot-Stick) Tools',
  lead:'A hot stick keeps the worker back while the work goes forward — isolation in tool form.',
  items:[
   {lvl:0,t:'Hot sticks are insulating tools (usually fiberglass/epoxy) that extend your reach beyond MAD'},
   {lvl:0,t:'Let qualified workers operate, test, install and remove equipment without closing the gap'},
   {lvl:0,t:'Common types:'},
   {lvl:1,t:'Universal / shotgun (telescoping) sticks with interchangeable heads'},
   {lvl:1,t:'Switch sticks, disconnect sticks, fuse pullers'},
   {lvl:1,t:'Tie sticks, wire-holding &amp; cleaning tools, measuring sticks'},
   {lvl:1,t:'Grounding sticks (clamp sticks) for applying protective grounds'},
   {lvl:0,t:'Keep them CLEAN and DRY — contamination &amp; moisture ruin the insulating surface'},
   {lvl:1,t:'Wipe down with an approved cleaner/wax; use a cradle, not the ground'},
   {lvl:0,t:'Inspect for scratches, cracks, soft spots; periodic dielectric testing required'},
  ]},

{type:'bullets',mod:M4,kicker:'4.4 Grounds',title:'Protective Grounds &amp; Grounding Equipment',
  items:[
   {lvl:0,t:'Personal protective grounds = flexible copper cables with clamps (ferrules) and ground studs'},
   {lvl:0,t:'Sized to carry the available fault current for the clearing time without failing'},
   {lvl:1,t:'Undersized grounds can fuse and fail under fault — use the correct cable size'},
   {lvl:0,t:'Components: cable, clamps, ferrules, ground rods/cluster bars, EPZ jumpers'},
   {lvl:0,t:'Apply correctly: clean contact points, tight clamps, ground end FIRST then line end'},
   {lvl:0,t:'Use grounding sticks to install/remove — treat the line as energized until grounds are on'},
   {lvl:0,t:'Inspect for broken strands, corroded clamps, loose ferrules; remove damaged sets from service'},
   {lvl:0,t:'Remove grounds in REVERSE: line end first, ground end last'},
  ]},

{type:'twocol',mod:M4,kicker:'4.5 Testers',title:'Voltage Detectors &amp; Testers',
  lh:'Types', lc:'var(--steel)',
  li:['Contact voltage detectors (on a hot stick)','Non-contact / proximity testers (presence of field)',
      'Phasing testers — verify phase relationships','Audible/visual indication of energized condition'],
  rh:'Use it right', rc:'var(--amber-d)',
  ri:['TEST the tester on a known source before AND after','Match the detector\'s range to the system voltage',
      'Test-before-touch on every conductor, every time','A “no voltage” reading from an unproven tester proves NOTHING']},

{type:'bullets',mod:M4,kicker:'4.6 FR / PPE',title:'Arc-Rated FR Clothing &amp; Personal PPE',
  items:[
   {lvl:0,t:'Flame-resistant (FR) / arc-rated (AR) clothing protects against arc-flash thermal energy'},
   {lvl:1,t:'Rated in cal/cm² (ATPV / arc rating) — must meet or exceed the job\'s incident energy'},
   {lvl:1,t:'Self-extinguishing; will not melt and drip like synthetics (no untreated nylon/poly next to skin)'},
   {lvl:0,t:'Layering increases protection; the outermost layer must be arc-rated'},
   {lvl:0,t:'Head/face/eyes: hard hat (Class E, electrical), arc-rated face shield/hood, safety glasses'},
   {lvl:0,t:'Hands: rubber gloves + leather protectors; feet: EH-rated footwear'},
   {lvl:0,t:'Hearing protection for arc-blast environments; no exposed conductive jewelry'},
   {lvl:0,t:'PPE is the LAST layer — it limits injury when other controls fail; it never replaces them'},
  ]},

{type:'bullets',mod:M4,kicker:'Module 4 Recap',title:'Module 4 — Key Takeaways',
  items:[
   {lvl:0,t:'Rubber gloves (with leather protectors) are first-line insulation — selected by voltage class'},
   {lvl:0,t:'Air-test and inspect rubber goods before every use; honor retest dates'},
   {lvl:0,t:'Hot sticks isolate the worker; grounds protect against re-energization — both must be tested &amp; sized'},
   {lvl:0,t:'Test your tester before AND after; test-before-touch every time'},
   {lvl:0,t:'Arc-rated FR PPE must meet or exceed the incident energy — and it\'s the last layer, not the plan'},

/* ===== MODULE 5 ===== */
{type:'divider',num:'5',title:'Putting It to Work in the Field',
  items:['Pre-job planning','Hazard assessment / JSA','The tailboard / job briefing',
         'Roles, responsibilities &amp; communication','Emergency response &amp; rescue']},

{type:'bullets',mod:M5,kicker:'5.1 Planning',title:'Pre-Job Planning — Before Boots Leave the Truck',
  items:[
   {lvl:0,t:'Understand the SCOPE: what work, on what equipment, at what voltage, energized or not'},
   {lvl:0,t:'Review prints, switching orders, clearances, and the circuit map'},
   {lvl:0,t:'Confirm the right crew, qualifications, and a competent person in charge'},
   {lvl:0,t:'Verify tools, PPE, cover-up, grounds — right ratings, inspected, in test date'},
   {lvl:0,t:'Check the weather: wind, lightning, heat, ice — conditions that stop or change the job'},
   {lvl:0,t:'Identify the access, the work zone, traffic control, and the public exposure'},
   {lvl:0,t:'Know the location: address, nearest cross-streets, gate codes — for emergency response'},
   {lvl:0,t:'Plan the rescue BEFORE the work — not after the incident'},
  ]},

{type:'callout',mod:M5,kicker:'5.2 Hazard Assessment',title:'Hazard Assessment / Job Safety Analysis (JSA)',kind:'info',
  items:[
   {lvl:0,t:'Break the job into steps; for each step identify the hazards and the controls'},
   {lvl:0,t:'Electrical hazards: energized parts, second points of contact, induced voltage, fault energy'},
   {lvl:0,t:'Mechanical/physical: falls, dropped objects, pinch points, equipment, rigging, tension'},
   {lvl:0,t:'Environmental: weather, traffic, terrain, wildlife, confined/excavation, public'},

{type:'bullets',mod:M5,kicker:'5.3 Tailboard',title:'The Tailboard / Job Briefing — What &amp; Why',

{type:'process',mod:M5,kicker:'5.3 Briefing',title:'Running an Effective Tailboard',
  steps:[
   {h:'1. Describe the job',p:'What are we doing, where, on what equipment, energized or de-energized, at what voltage.'},
   {h:'2. Walk the hazards',p:'Go through the JSA: electrical (second points, MAD, induction), falls, traffic, weather, public.'},
   {h:'3. State the controls',p:'Cover-up plan, grounds/EPZ, LOTO/clearance, MAD, PPE, traffic control — specific, not generic.'},
   {h:'4. Assign roles',p:'Person in charge, who works, who tends, who grounds, who watches, who calls for help.'},
   {h:'5. Confirm rescue &amp; comms',p:'Location/address, nearest hospital, rescue plan &amp; equipment, radio/phone, hand signals.'},
   {h:'6. Engage the crew',p:'Ask questions, invite input, confirm understanding — everyone has stop-work authority.'},

{type:'bullets',mod:M5,kicker:'5.5 Communication',title:'Communication — The Glue That Holds the Job Together',

{type:'callout',mod:M5,kicker:'5.6 Rescue',title:'Emergency Response &amp; Rescue — Plan It Before You Need It',kind:'warn',

   {lvl:0,t:'Call for help early: know the address, cross-streets, and access'},

{type:'divider',num:'7',title:'Arc-Flash Analysis, First Aid &amp; Rescue',
  items:['What drives incident energy','The arc-flash boundary &amp; working distance','PPE categories &amp; the label',
         'Electrical injury &amp; burns','Scene control, CPR &amp; AED']},

{type:'bullets',mod:M7,kicker:'7.1 Incident Energy',title:'Arc-Flash Analysis — What Drives Incident Energy',
  lead:'Why two jobs at the same voltage can carry wildly different arc-flash hazard.',
  items:[
   {lvl:0,t:'Incident energy is the thermal energy reaching a surface a set distance from an arc — measured in cal/cm²'},
   {lvl:0,t:'It rises with the available fault (bolted) current and with how long the arc lasts'},
   {lvl:1,t:'Clearing time is decisive: a faster-tripping device means far less energy'},
   {lvl:0,t:'It falls with the SQUARE of the distance from the arc'},
   {lvl:0,t:'An analysis (IEEE 1584 / NFPA 70E) calculates it for each location'},
   {lvl:1,t:'Inputs: fault current, electrode gap &amp; configuration, equipment type, working distance'},
   {lvl:0,t:'The result drives two things: the required PPE arc rating and the arc-flash boundary'},
  ]},

{type:'callout',mod:M7,kicker:'7.2 Boundary &amp; Distance',title:'The Arc-Flash Boundary &amp; Working Distance',kind:'info',
  items:[
   {lvl:0,t:'Working distance: the arc-to-worker distance used in the calc (often 18 in for distribution)'},
   {lvl:1,t:'The incident energy AT that distance sets the PPE arc rating you must wear'},
   {lvl:0,t:'Arc-flash boundary: the distance where incident energy = 1.2 cal/cm²'},
   {lvl:1,t:'1.2 cal/cm² is the onset of a second-degree burn to bare skin'},
   {lvl:0,t:'Anyone inside the boundary must wear arc-rated PPE'},
   {lvl:0,t:'Shock approach boundaries (limited / restricted) are separate and based on voltage'},
  ],
  coTitle:'Two different boundaries',
  coText:['Arc-flash boundary = thermal (cal/cm²).','Shock approach boundaries = voltage-based (the MAD family).',
          'Respect both — they guard against different hazards.']},

{type:'table',mod:M7,kicker:'7.3 PPE Categories',title:'Arc-Flash PPE Categories (NFPA 70E)',
  headers:['Category','Min arc rating','Typical ensemble'], cw:[18,24,58], fs:13,
  rows:[['CAT 1','≥ 4 cal/cm²','AR shirt &amp; pants, hard hat, arc face shield, gloves'],
        ['CAT 2','≥ 8 cal/cm²','Above + arc-rated hood or balaclava with face shield'],
        ['CAT 3','≥ 25 cal/cm²','AR flash-suit jacket &amp; trousers + arc-rated hood'],
        ['CAT 4','≥ 40 cal/cm²','Heavy AR flash suit &amp; hood — full ensemble']],
  note:'The category method is one approach; an incident-energy analysis is the other. Either way the garment’s arc rating (ATPV, cal/cm²) must meet or exceed the incident energy. Above ~40 cal/cm² the blast hazard alone may make energized work unacceptable — de-energize.'},

{type:'bullets',mod:M7,kicker:'7.4 The Label',title:'Reading the Arc-Flash Label',
  lead:'The label turns the engineering study into a field decision — read it before you open the door.',
  items:[
   {lvl:0,t:'Equipment should carry a label produced from the facility’s arc-flash analysis'},
   {lvl:0,t:'Typical fields:'},
   {lvl:1,t:'Nominal system voltage · arc-flash boundary · incident energy @ working distance'},
   {lvl:1,t:'Required PPE category · minimum glove class · shock approach boundaries'},
   {lvl:0,t:'Use it to select PPE and set your boundaries BEFORE energizing or opening equipment'},
   {lvl:0,t:'Missing, outdated, or illegible label → STOP and get the analysis'},
   {lvl:0,t:'Labels change when the system changes — new transformer, settings, or fault current'},
  ]},

{type:'bullets',mod:M7,kicker:'7.5 Electrical Injury',title:'Electrical Injury — What Happens to the Body',
  lead:'One contact can injure several body systems at once — which is why every contact gets evaluated.',
  items:[
   {lvl:0,t:'Cardiac: ventricular fibrillation or arrest from current across the chest'},
   {lvl:0,t:'Burns: surface arc burns AND internal burns along the current path'},
   {lvl:1,t:'Small entry/exit wounds can hide massive internal tissue damage'},
   {lvl:0,t:'Respiratory: chest muscles lock — breathing can stop'},
   {lvl:0,t:'Neurological: nerve damage, confusion, lasting deficits'},
   {lvl:0,t:'Trauma: falls from the shock, blast-thrown objects and molten metal'},
   {lvl:0,t:'Delayed effects: kidney injury from tissue breakdown; rhythm problems hours later'},
  ]},

{type:'callout',mod:M7,kicker:'7.6 Scene Control',title:'Emergency Response — Scene Control &amp; the Rescuer',kind:'warn',
  items:[
   {lvl:0,t:'Protect yourself FIRST — a second victim helps no one'},
   {lvl:0,t:'Do NOT touch the patient until the source is removed / de-energized and you know it'},
   {lvl:0,t:'Treat downed conductors and the ground around them as energized — keep a wide barrier'},
   {lvl:0,t:'Call for help early with a precise location; send someone for the AED'},
   {lvl:0,t:'Decide who is in charge of the rescue and communicate clearly'},
  ],
  coTitle:'The order is fixed',
  coText:['1. Make the scene safe (remove the source).','2. Reach the patient.','3. Treat — CPR/AED, then burns.',
          'Never skip step 1 to save time.']},

{type:'process',mod:M7,kicker:'7.7 CPR &amp; AED',title:'CPR &amp; AED for Electrical Contact',
  lead:'Push hard, push fast, minimize interruptions.',
  steps:[
   {h:'1. Scene safe',p:'Confirm the source is removed / de-energized before you approach the patient.'},
   {h:'2. Check &amp; call',p:'Check responsiveness and breathing; call 911 and send for the AED.'},
   {h:'3. Compressions',p:'Center of the chest, 100–120 per minute, about 2 inches deep, full recoil.'},
   {h:'4. Apply the AED',p:'Power on, attach pads, follow the voice prompts; clear for analysis and shock.'},
   {h:'5. Continue',p:'Resume compressions immediately; cycle until EMS takes over.'},
  ]},

{type:'bullets',mod:M7,kicker:'7.8 Burns &amp; Care',title:'Burns &amp; Ongoing Care',
  items:[
   {lvl:0,t:'Stop the burning; cool a thermal burn with clean water where appropriate'},
   {lvl:0,t:'Cover with a clean, dry dressing — do not break blisters or apply ointments to severe burns'},
   {lvl:0,t:'Treat for shock; keep the patient warm'},
   {lvl:0,t:'Electrical burns are deceptive — internal damage far exceeds the visible wound'},
   {lvl:0,t:'ALWAYS transport for medical evaluation after any contact, even if they feel fine'},
   {lvl:0,t:'Report and investigate the contact — every event is a chance to prevent the next'},
  ]},

{type:'bullets',mod:M7,kicker:'Module 7 Recap',title:'Module 7 — Key Takeaways',

   {h:'Choose the control',p:'De-energize if you can. If hot: isolate AND insulate — MAD, cover-up, gloves, grounds, EPZ.'},

   {h:'Brief &amp; assign',p:'Tailboard the hazards, controls, roles, comms, and rescue. Everyone understands. Everyone can stop work.'},

   {lvl:0,t:'Inspect rubber goods and tools before every use; honor test dates'},
   {lvl:0,t:'Hold a real tailboard — and re-brief when anything changes'},
   {lvl:0,t:'Plan the rescue before the work; never become the second victim'},
   {lvl:0,t:'Use your stop-work authority — no job is worth your life'},

const FIGS=[
 {after:'1.1 First Principles',s:{type:'diagram',mod:M1,kicker:'1.1 · Illustrated',title:'How Electricity Flows',fig:'atom',layout:'split',
   notes:['Protons (+) and neutrons sit in the dense <b>nucleus</b>.','Electrons orbit; the outer ones are loosely held.','A difference in charge makes free electrons <b>drift</b> — that drift is current.'],
   tip:'A conductor holds billions of free electrons ready to move the instant a potential difference appears.'}},
 {after:'1.2 Materials',s:{type:'diagram',mod:M1,kicker:'1.2 · Illustrated',title:'Conductors vs Insulators',fig:'conductor',layout:'split',
   notes:['<b>Conductors</b> let electrons pass — low resistance.','<b>Insulators</b> bind their electrons — high resistance.','Your body and wet wood conduct; rubber and air (at distance) insulate.'],
   tip:'Every protective method is just an insulator placed between you and a difference of potential.'}},
 {after:'1.3 Voltage',s:{type:'diagram',mod:M1,kicker:'1.3 · Illustrated',title:'The Water Analogy',fig:'water',layout:'split',
   notes:['<b>Voltage</b> = pressure from the pump.','<b>Current</b> = the rate of flow in the pipe.','<b>Resistance</b> = a restriction that limits the flow.'],
   tip:'Raise the pressure (V) or lower the restriction (R) and more current flows: I = V ÷ R.'}},
 {after:'1.4 Current',s:{type:'diagram',mod:M1,kicker:'1.4 · Illustrated',title:'Why Voltage Needs Two Points',fig:'bird',layout:'split',
   notes:['<b>Left:</b> one wire, one potential — safe, like a bird.','<b>Right:</b> a second contact at a different potential completes the circuit.','The <b>difference</b> of potential drives current — not the wire itself.'],
   tip:'This is the seed of the Second Point of Contact rule you will master in Module 3.'}},
 {after:"1.5 Ohm's Law",s:{type:'diagram',mod:M1,kicker:'1.5 · Illustrated',title:'The Ohm’s Law &amp; Power Wheel',fig:'ohm',layout:'split',
   notes:['Cover the unknown in the <b>V / I / R</b> triangle — the rest is the formula.','V sits on top: V = I × R; I and R sit side by side.','Power P = V × I — and crucially P = I² × R.'],
   tip:'Because heat rises with current squared, a small rise in fault current is a large rise in arc energy.'}},
 {after:'1.6 Waveforms',s:{type:'diagram',mod:M1,kicker:'1.6 · Illustrated',title:'AC vs DC Waveforms',fig:'acdc',layout:'wide',capY:445,
   caption:'<b>DC</b> flows one direction at a steady level. <b>AC</b> reverses 60 times a second — which is exactly why transformers can change its voltage, and why the grid runs on it.'}},
 {after:'1.7 Phases',s:{type:'diagram',mod:M1,kicker:'1.7 · Illustrated',title:'Three-Phase Power',fig:'threephase',layout:'wide',capY:445,
   caption:'Three AC waveforms spaced 120° apart deliver smooth, continuous power — the backbone of transmission, distribution, and large motors.'}},
 {after:'1.8 Transformers',s:{type:'diagram',mod:M1,kicker:'1.8 · Illustrated',title:'How a Transformer Works',fig:'transformer',layout:'split',
   notes:['Two coils share a magnetic core — no metallic connection.','The <b>turns ratio</b> sets the voltage ratio.','Step up for transmission; step down for the customer.'],
   tip:'Power in ≈ power out, so a secondary can be back-fed — a generator can re-energize a “dead” line.'}},
 {after:'1.9 The System',s:{type:'diagram',mod:M1,kicker:'1.9 · Illustrated',title:'The Grid, End to End',fig:'grid',layout:'wide',capY:445,
   caption:'Voltage is stepped <b>up</b> for efficient long-distance transmission, then stepped <b>down</b> in stages until it is safe for the customer. Always know where you are on this chain.'}},
 {after:'2.1 Shock Physiology',s:{type:'diagram',mod:M2,kicker:'2.1 · Illustrated',title:'Current Path Through the Body',fig:'body',layout:'split',
   notes:['Current follows the path between the two contact points.','<b>Hand-to-hand or hand-to-foot</b> routes it across the heart.','Milliamps across the heart can cause fibrillation.'],
   tip:'This is why we control BOTH points of contact — not just the hand on the conductor.'}},
 {after:'2.2 Thresholds',s:{type:'diagram',mod:M2,kicker:'2.2 · Illustrated',title:'Shock Threshold Ladder',fig:'threshold',layout:'split',
   notes:['Perception starts near 1 mA; “let-go” is lost by ~10–16 mA.','Fibrillation becomes likely at 50–100 mA.','Above ~100 mA, the shock is usually fatal.'],
   tip:'The lethal range is in milliamps — far below what trips a typical breaker.'}},
 {after:'2.5 Arc Flash',s:{type:'diagram',mod:M2,kicker:'2.5 · Illustrated',title:'Arc Flash &amp; Arc Blast',fig:'arcflash',layout:'split',
   notes:['An arc through ionized air releases enormous heat and pressure.','Temperatures reach ~35,000°F; the blast throws molten metal and shrapnel.','It can be triggered by proximity alone — no contact needed.'],
   tip:'Defenses: distance, de-energizing, and arc-rated FR clothing & face protection.'}},
 {after:'2.6 Ground Gradients',s:{type:'diagram',mod:M2,kicker:'2.6 · Illustrated',title:'Step &amp; Touch Potential',fig:'steptouch',layout:'wide',capY:445,
   caption:'Current spreading from a downed line creates a voltage gradient in the earth. The difference between your feet — <b>step potential</b> — can shock you. Shuffle out with your feet together.'}},
 {after:'3.1 Controls',s:{type:'diagram',mod:M3,kicker:'3.1 · Illustrated',title:'The Hierarchy of Controls',fig:'hierarchy',layout:'split',
   notes:['Always work from the <b>top</b> of the pyramid down.','Eliminate (de-energize) beats every other control.','PPE is the last layer — it limits injury when all else fails.'],
   tip:'PPE alone is never the plan; it backs up the controls above it.'}},
 {after:'3.2 MAD',s:{type:'diagram',mod:M3,kicker:'3.2 · Illustrated',title:'Minimum Approach Distance',fig:'mad',layout:'split',
   notes:['MAD is the closest you may approach an energized part.','It keeps the air gap larger than the voltage can flash across.','It grows with both voltage and altitude.'],
   tip:'Your body, tools, boom, and materials all count toward the distance.'}},
 {after:'3.3 SECOND POINT OF CONTACT',s:{type:'diagram',mod:M3,kicker:'3.3 · Illustrated',title:'The Second Point of Contact',fig:'secondpoint',layout:'wide'}},
 {after:'3.5 Cover-Up',s:{type:'diagram',mod:M3,kicker:'3.5 · Illustrated',title:'Cover-Up at the Pole Top',fig:'coverup',layout:'split',
   notes:['Insulating guards cover energized AND grounded parts in reach.','Cover the <b>nearest</b> hazard first, then work outward.','Remove in reverse — last on, first off.'],
   tip:'Cover-up backs up your gloves and MAD by removing the second point of contact.'}},
 {after:'3.6 De-Energize / LOTO',s:{type:'diagram',mod:M3,kicker:'3.6 · Illustrated',title:'The De-Energize / LOTO Sequence',fig:'loto',layout:'wide',capY:425,
   caption:'Identify → open → lock &amp; tag → <b>test</b> → ground. Prove the line dead with a tested-good detector, then ground it. Never skip a step.'}},
 {after:'3.7 Grounding &amp; EPZ',s:{type:'diagram',mod:M3,kicker:'3.7 · Illustrated',title:'The Equipotential Zone',fig:'epz',layout:'split',
   notes:['Bond everything you can touch to one potential.','Ground that zone so a re-energized line trips protection fast.','Inside the zone you ride the voltage up and down together.'],
   tip:'No difference of potential across your body means no current through it — just like the bird on the wire.'}},
 {after:'4.1 Glove Classes',s:{type:'diagram',mod:M4,kicker:'4.1 · Illustrated',title:'Rubber Glove Voltage Classes',fig:'gloves',layout:'wide',capY:445,
   caption:'Glove class is chosen by maximum use voltage. Select a class rated <b>at or above</b> your system voltage — always worn with leather protectors.'}},
 {after:'4.3 Hot Sticks',s:{type:'diagram',mod:M4,kicker:'4.3 · Illustrated',title:'The Live-Line (Hot-Stick) Method',fig:'hotstick',layout:'split',
   notes:['A fiberglass live-line tool extends reach beyond MAD.','You operate, test, and install through the tool.','Keep it clean and dry — contamination ruins its insulation.'],
   tip:'The hot-stick method isolates the worker by distance, not just by gloves.'}},
 {after:'4.4 Grounds',s:{type:'diagram',mod:M4,kicker:'4.4 · Illustrated',title:'Protective Grounding Sets',fig:'grounds',layout:'split',
   notes:['Flexible copper cables and clamps form a low-resistance path.','Sized for the available fault current and clearing time.','Connect the ground end first, the line ends last.'],
   tip:'Undersized grounds can fuse and fail under fault — use the correct cable size.'}},
 {after:'4.6 FR / PPE',s:{type:'diagram',mod:M4,kicker:'4.6 · Illustrated',title:'Head-to-Toe PPE',fig:'ppe',layout:'split',
   notes:['Arc-rated FR layers protect against thermal energy (cal/cm²).','Class E hard hat, arc face shield, rubber gloves + leather protectors.','The outermost layer must be arc-rated; nothing meltable underneath.'],
   tip:'PPE is the LAST line of defense — it limits injury, it does not prevent contact.'}},
 {after:'5.3 Tailboard',s:{type:'diagram',mod:M5,kicker:'5.3 · Illustrated',title:'The Tailboard Briefing',fig:'tailboard',layout:'split',
   notes:['The crew briefing aligns everyone before work starts.','Cover hazards, procedures, precautions, energy controls, and PPE.','Assign roles and confirm the rescue plan.'],
   tip:'Re-brief whenever the job, crew, weather, or scope changes — and everyone can stop work.'}},
 {after:'2.7 Downed Lines',s:{type:'diagram',mod:M2,kicker:'2.7 · Illustrated',title:'Reclosers — Why a Dead Line Bites Back',fig:'recloser',layout:'wide',capY:445,
   caption:'Protective reclosers trip on a fault, then automatically re-close — often several times in seconds — before locking out. A downed or contacted line can re-energize <b>without warning</b>.'}},
 {after:'3.4 Two Methods',s:{type:'diagram',mod:M3,kicker:'3.4 · Illustrated',title:'The Insulated Aerial Device',fig:'bucket',layout:'split',
   notes:['The fiberglass <b>upper boom</b> is a dielectric insulating section.','It isolates the bucket and worker from the truck and ground.','Rubber-glove method proceeds in the bucket with full cover-up.'],
   tip:'The insulating gap is only as good as its inspection, cleanliness, and dielectric test record.'}},
 {after:'3.8 Induced Voltage',s:{type:'diagram',mod:M3,kicker:'3.8 · Illustrated',title:'How Induced Voltage Appears',fig:'induced',layout:'wide',capY:445,
   caption:'A live circuit couples energy — magnetically and electrostatically — onto a parallel de-energized line. Grounding <b>at the work site</b>, not just the ends, keeps that induced potential off the worker.'}},
 {after:'4.5 Testers',s:{type:'diagram',mod:M4,kicker:'4.5 · Illustrated',title:'Phasing &amp; Voltage Testing',fig:'phasing',layout:'split',
   notes:['Detectors verify the presence/absence of voltage and phase.','Match the detector range to the system voltage.','<b>Test the tester</b> on a known live source — before and after.'],
   tip:'A “no-voltage” reading from an unproven tester proves nothing — prove it works first.'}},
 {after:'5.1 Planning',s:{type:'diagram',mod:M5,kicker:'5.1 · Illustrated',title:'Switching &amp; the Clearance',fig:'switching',layout:'wide',capY:445,
   caption:'A clearance isolates the work zone on every side: switches open and visible, locked and tagged, the line tested dead and grounded. Only the clearance holder releases it once all workers are clear.'}},
 {after:'5.6 Rescue',s:{type:'diagram',mod:M5,kicker:'5.6 · Illustrated',title:'Pole-Top Rescue',fig:'rescue',layout:'split',
   notes:['Remove or de-energize the <b>source of contact</b> first.','Lower the patient with the handline / rescue device.','Begin CPR &amp; use the AED — minutes decide the outcome.'],
   tip:'A rescuer who becomes the second victim helps no one — protect yourself first.'}},
 {after:'7.1 Incident Energy',s:{type:'diagram',mod:M7,kicker:'7.1 · Illustrated',title:'Incident Energy vs Working Distance',fig:'arcenergy',layout:'wide',capY:445,
   caption:'Incident energy drops with the <b>square</b> of the working distance. Where it crosses 1.2 cal/cm² is the arc-flash boundary; the energy at the worker sets the required PPE arc rating.'}},
 {after:'7.3 PPE Categories',s:{type:'diagram',mod:M7,kicker:'7.3 · Illustrated',title:'Arc-Flash PPE Categories',fig:'ppecat',layout:'wide',capY:445,
   caption:'Four categories from ≥4 to ≥40 cal/cm². The garment’s arc rating (ATPV) must <b>meet or exceed</b> the incident energy at your working distance.'}},
 {after:'7.4 The Label',s:{type:'diagram',mod:M7,kicker:'7.4 · Illustrated',title:'The Arc-Flash &amp; Shock Label',fig:'arclabel',layout:'split',
   notes:['The label is the engineering study made usable in the field.','Carries voltage, boundaries, incident energy, PPE category, glove class.','Missing or outdated label → stop and get the analysis.'],
   tip:'Select your PPE and set your boundaries before you open the door.'}},
 {after:'7.6 Scene Control',s:{type:'diagram',mod:M7,kicker:'7.6 · Illustrated',title:'Emergency Scene Control',fig:'scenecontrol',layout:'wide',capY:445,
   caption:'Treat the downed conductor and the ground around it as energized. Keep back and keep the patient untouched until the source is removed — <b>then</b> reach them.'}},
 {after:'7.7 CPR &amp; AED',s:{type:'diagram',mod:M7,kicker:'7.7 · Illustrated',title:'CPR &amp; AED Sequence',fig:'cpraed',layout:'wide',capY:425,
   caption:'Once the scene is safe: check &amp; call, compress at 100–120/min, apply the AED, and continue cycles until EMS arrives.'}},
];
FIGS.forEach(f=>{const idx=SLIDES.findIndex(x=>x.kicker===f.after);if(idx>=0)SLIDES.splice(idx+1,0,f.s);else console.warn('no match for',f.after);});

/* ============================================================
   BUILD + NAVIGATION
   ============================================================ */
const stage=document.getElementById('stage');
SLIDES.forEach((s,i)=>{ stage.insertAdjacentHTML('beforeend', RENDER[s.type](s, i)); });
const slides=[...stage.querySelectorAll('.slide')];
let cur=0;

function fitStage(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const scale=Math.min(vw/1280, vh/720);
  stage.style.transform=`scale(${scale})`;
}
window.addEventListener('resize',fitStage); fitStage();

function show(n){
  n=Math.max(0,Math.min(SLIDES.length-1,n));
  slides[cur].classList.remove('active');
  cur=n;
  slides[cur].classList.add('active');
  document.getElementById('counter').textContent=`${cur+1} / ${SLIDES.length}`;
  document.getElementById('progress').style.width=((cur)/(SLIDES.length-1)*100)+'%';
  const s=SLIDES[cur];
  document.getElementById('title-tag').textContent=(s.title||s.kicker||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');
  updateNotes(s);
  try{ if(history.replaceState) history.replaceState(null,'','#'+(cur+1)); }catch(e){ try{ location.hash=cur+1; }catch(_){} }
}
function next(){show(cur+1);} function prev(){show(cur-1);}

/* ---------- speaker notes ---------- */
function normT(s){return (s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&rsquo;/g,String.fromCharCode(39))
  .replace(/&ldquo;|&rdquo;/g,'').replace(/[“”]/g,'').replace(/[‘’]/g,String.fromCharCode(39))
  .replace(/\s+/g,' ').trim();}
function noteFor(s){
  if(!s) return '';
  let n='';
  if(s.type==='diagram'){
    if(s.caption) n=s.caption;
    else n=((s.notes||[]).join('  ')+(s.tip?('  '+s.tip):''));
  } else {
    n=(window.SPEAKER_NOTES&&window.SPEAKER_NOTES[normT(s.title)])||'';
  }
  return n.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&rsquo;/g,String.fromCharCode(39));
}
function updateNotes(s){document.getElementById('notes-body').textContent=noteFor(s)||'— (no notes for this slide) —';}
function toggleNotes(){document.getElementById('notes-panel').classList.toggle('show');}

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(ov.classList.contains('show')){ if(e.key==='Escape'||e.key==='o'||e.key==='O'){toggleOv();} return; }
  switch(e.key){
    case 'ArrowRight':case 'ArrowDown':case 'PageDown':case ' ':next();e.preventDefault();break;
    case 'ArrowLeft':case 'ArrowUp':case 'PageUp':prev();e.preventDefault();break;
    case 'Home':show(0);break; case 'End':show(SLIDES.length-1);break;
    case 'f':case 'F':toggleFs();break;
    case 'o':case 'O':toggleOv();break;
    case 'n':case 'N':toggleNotes();break;
    case 'd':case 'D':toggleDark();break;
  }
});
function toggleDark(){
  document.body.classList.toggle('dark');
  try{ localStorage.setItem('pl_theme', document.body.classList.contains('dark')?'dark':'light'); }catch(e){}
}
try{ if(localStorage.getItem('pl_theme')==='dark') document.body.classList.add('dark'); }catch(e){}
document.getElementById('notesbtn').onclick=toggleNotes;
document.getElementById('darkbtn').onclick=toggleDark;
// click navigation on stage (left third = prev, else next)
stage.addEventListener('click',e=>{
  const r=stage.getBoundingClientRect();
  if((e.clientX-r.left)/r.width < 0.28) prev(); else next();
});
// touch swipe
let tx=0;
stage.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40){dx<0?next():prev();}});

function toggleFs(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}
  else{document.exitFullscreen?.();}
}
document.getElementById('fsbtn').onclick=toggleFs;

/* ---------- overview grid ---------- */
const ov=document.getElementById('overview'), ovgrid=document.getElementById('ovgrid');
let ovBuilt=false;
function buildOv(){
  slides.forEach((sl,i)=>{
    const card=document.createElement('div'); card.className='ov-card';
    const thumb=document.createElement('div'); thumb.className='ov-thumb';
    thumb.style.width='1280px'; thumb.style.height='720px';
    thumb.innerHTML=sl.outerHTML.replace('class="slide','class="slide active');
    card.appendChild(thumb);
    const tag=document.createElement('div'); tag.className='ov-n'; tag.textContent=i+1; card.appendChild(tag);
    card.onclick=()=>{show(i);toggleOv();};
    ovgrid.appendChild(card);
    // scale thumb to card width
    requestAnimationFrame(()=>{ const w=card.clientWidth; thumb.style.transform=`scale(${w/1280})`; });
  });
  ovBuilt=true;
}
function toggleOv(){
  if(!ovBuilt) buildOv();
  ov.classList.toggle('show');
  if(ov.classList.contains('show')){
    // rescale thumbs (in case of resize)
    [...ovgrid.children].forEach(card=>{const t=card.querySelector('.ov-thumb');const w=card.clientWidth;t.style.transform=`scale(${w/1280})`;});
  }
}
document.getElementById('ovbtn').onclick=toggleOv;

// open at hash
const startN=parseInt(location.hash.replace('#',''))||1;
slides[0].classList.add('active'); show(startN-1);
</script>
</body>
</html>
